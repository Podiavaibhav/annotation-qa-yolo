# Dataset paths
dataset_path: null
output_dir: outputs

# YOLO model settings
model_name: yolov8n.pt
device: auto  # auto lets Ultralytics choose; or set 0, cpu, mps

# Training settings
epochs: 30
img_size: 640
batch_size: 16
seed: 42                    # seeds the noise injector and the out-of-fold split
train_seeds: [42, 43, 44]   # each variant (Original/Noisy/Cleaned) is trained once per seed
optimizer: auto

# Detection
confidence_threshold: 0.50          # predictions below this are ignored
iou_threshold: 0.50                 # label and prediction count as the same object above this
localization_iou_threshold: 0.70    # same object but IoU below this = badly placed box
localization_min_iou: 0.10          # unmatched label/prediction above this IoU = same object, badly placed
detector_mode: oof                  # oof = each image predicted by a model that never saw it; pretrained = one model
oof_folds: 2
oof_epochs: 30

# Analysis thresholds
tiny_box_threshold: 0.001
duplicate_iou_threshold: 0.98
max_box_area: 0.95
min_aspect_ratio: 0.1
max_aspect_ratio: 10.0

# Noise injection. Each box is hit by at most one of delete/flip/shift/resize; duplicate is an extra roll.
noise:
  delete_probability: 0.08
  class_flip_probability: 0.08
  coordinate_shift_probability: 0.08
  resize_probability: 0.06
  duplicate_probability: 0.04
  shift_min: 0.2      # a shift moves a box by shift_min..shift_amount of its own size
  shift_amount: 0.5
  resize_min: 0.25    # a resize scales width and height by 1 +/- (resize_min..resize_amount)
  resize_amount: 0.5

# Cleaning
#   conservative    invalid/malformed boxes and exact duplicates only
#   model_assisted  + relabel / re-place / add boxes using the detector's audit
#   aggressive      + remove tiny, extreme-aspect and huge boxes (can delete real objects)
cleaning_mode: model_assisted
clean_relabel_confidence: 0.6   # a prediction must be at least this confident to change a class
clean_replace_confidence: 0.6   # ... to move/resize a box
clean_add_confidence: 0.7       # ... to add a missing box
